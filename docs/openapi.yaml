openapi: 3.1.0
info:
  title: Cloudflare DDNS Gateway API
  version: 1.0.0
  license: { name: MIT }
servers:
  - { url: 'https://ddns.example.com', description: DDNS update and path-isolated Access administration }
tags:
  - { name: DDNS }
  - { name: Admin, description: Requires an administrator authorized by the Cloudflare Access policy. }
paths:
  /api/ddns/{clientSlug}:
    post:
      tags: [DDNS]
      operationId: updateDdns
      security: [{ bearerAuth: [] }]
      parameters: [{ name: clientSlug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' } }]
      responses:
        '200': { description: Updated or unchanged, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateResult' } } } }
        '400': { description: HTTPS required or no valid source IP }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Client disabled }
        '429': { description: Rate limited }
        '502': { description: DNS update failed }
  /api/ddns/{clientSlug}/unifi:
    get:
      tags: [DDNS]
      summary: Optional UniFi/Inadyn compatibility endpoint
      description: Enabled by the shipped Wrangler configuration and independently switchable with ENABLE_UNIFI_COMPAT. Username must equal clientSlug; password is the one-time Client Token. Hostname query values are ignored.
      security: [{ basicAuth: [] }]
      parameters: [{ name: clientSlug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' } }]
      responses:
        '200': { description: Inadyn-compatible result, content: { text/plain: { schema: { type: string }, examples: { updated: { value: 'good 203.0.113.10' }, unchanged: { value: 'nochg 203.0.113.10' } } } } }
        '400': { description: HTTPS required or rejected query parameter }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Client disabled }
        '404': { description: Compatibility mode disabled }
        '429': { description: Rate limited }
        '502': { description: DNS update failed }
  /admin/api/dashboard:
    get: { tags: [Admin], security: [{ accessJwt: [] }], responses: { '200': { description: Dashboard counters }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /admin/api/config:
    get:
      tags: [Admin]
      security: [{ accessJwt: [] }]
      responses:
        '200': { description: Safe runtime configuration, content: { application/json: { schema: { $ref: '#/components/schemas/AdminConfigEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/api/clients:
    get: { tags: [Admin], security: [{ accessJwt: [] }], responses: { '200': { description: Client list }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post:
      tags: [Admin]
      security: [{ accessJwt: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientInput' } } } }
      responses: { '201': { description: Client and one-time token }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Duplicate binding } }
  /admin/api/clients/{id}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    get: { tags: [Admin], security: [{ accessJwt: [] }], responses: { '200': { description: Client detail }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Not found } } }
    put: { tags: [Admin], security: [{ accessJwt: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientInput' } } } }, responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Forbidden' } } }
    delete: { tags: [Admin], security: [{ accessJwt: [] }], requestBody: { $ref: '#/components/requestBodies/EmptyJson' }, responses: { '200': { description: Deleted }, '403': { $ref: '#/components/responses/Forbidden' }, '415': { description: JSON Content-Type required } } }
  /admin/api/clients/{id}/{action}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }, { name: action, in: path, required: true, schema: { enum: [enable, disable, rotate-token] } }]
    post: { tags: [Admin], security: [{ accessJwt: [] }], requestBody: { $ref: '#/components/requestBodies/EmptyJson' }, responses: { '200': { description: Action completed; rotate-token includes one-time token }, '403': { $ref: '#/components/responses/Forbidden' }, '415': { description: JSON Content-Type required } } }
  /admin/api/clients/{id}/logs:
    get: { tags: [Admin], security: [{ accessJwt: [] }], parameters: [{ $ref: '#/components/parameters/ClientId' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }, { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }], responses: { '200': { description: Update logs }, '400': { description: Invalid pagination }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /admin/api/cloudflare/validate-record:
    post: { tags: [Admin], security: [{ accessJwt: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordInput' } } } }, responses: { '200': { description: Validated DNS record }, '403': { $ref: '#/components/responses/Forbidden' } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: 'ddns_<random>' }
    basicAuth: { type: http, scheme: basic, description: 'UniFi only: username=client slug, password=Client Token. Never use a Cloudflare API token.' }
    accessJwt: { type: apiKey, in: header, name: Cf-Access-Jwt-Assertion, description: Injected by Cloudflare Access; never log or persist. }
  parameters:
    ClientId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    EmptyJson: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0 }, example: {} } } }
  schemas:
    UpdateResult: { type: object, required: [success, updated], properties: { success: { const: true }, updated: { type: boolean } } }
    ClientInput: { type: object, additionalProperties: false, required: [displayName, slug, zoneId, zoneName, recordId, recordName, recordType], properties: { displayName: { type: string }, slug: { type: string }, zoneId: { type: string }, zoneName: { type: string }, recordId: { type: string }, recordName: { type: string }, recordType: { enum: [A, AAAA] } } }
    RecordInput: { type: object, additionalProperties: false, required: [zoneId, zoneName, recordId, recordName, recordType], properties: { zoneId: { type: string }, zoneName: { type: string }, recordId: { type: string }, recordName: { type: string }, recordType: { enum: [A, AAAA] } } }
    AdminConfigEnvelope: { type: object, required: [success, data], properties: { success: { const: true }, data: { type: object, additionalProperties: false, required: [ddnsOrigin, unifiCompatibilityEnabled], properties: { ddnsOrigin: { type: string, format: uri }, unifiCompatibilityEnabled: { type: boolean } } } } }
    Error: { type: object, required: [success, message], properties: { success: { const: false }, message: { type: string } } }
  responses:
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { success: false, message: Unauthorized } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { success: false, message: Forbidden } } } }
